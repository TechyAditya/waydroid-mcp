# Publishes the package to npm, with provenance, when a version tag is pushed.
#
# npm authenticates this workflow through trusted publishing: the package's settings on
# npmjs.com name this repository and this file as its trusted publisher, with npm publish
# allowed. No npm token is needed or used.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs npm 11.5.1 or later; Node.js 24 ships it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match version $version in package.json."
            exit 1
          fi

      - run: npm ci

      - run: npm pack --dry-run

      - run: npm publish --access public --provenance
