# Publishes the package to npm, with provenance, when a version tag is pushed.
#
# npm authenticates this workflow through trusted publishing once npmjs.com lists this
# repository and this file as the package's trusted publisher. A package's first version
# can't be published that way, so until then the NPM_TOKEN secret must hold an npm token.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs npm 11.5.1 or later; Node.js 24 ships it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match version $version in package.json."
            exit 1
          fi

      - run: npm ci

      - run: npm pack --dry-run

      # An empty token in .npmrc would stop npm from using trusted publishing.
      - name: Use NPM_TOKEN if it is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"
            echo "Publishing with NPM_TOKEN."
          else
            echo "Publishing with trusted publishing."
          fi

      - run: npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
